<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a2c">
  <meta name="description" content="黎怡捷 UI/UX 设计师作品集，按 01 至 43 页在线浏览。">
  <title>黎怡捷 · UI/UX 设计师作品集</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3f6fb;
      --muted: #9aa8bd;
      --line: #31415c;
      --accent: #55d6b0;
      --chrome: #111a2c;
      --canvas: #0d1524;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--canvas); }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    .toolbar {
      position: sticky;
      z-index: 5;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 64px;
      padding: 10px clamp(14px, 3vw, 42px);
      border-bottom: 1px solid rgba(145, 165, 195, .18);
      background: rgba(17, 26, 44, .96);
      backdrop-filter: blur(14px);
    }
    .brand { min-width: 0; }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .04em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    .controls { display: flex; align-items: center; gap: 8px; }
    button, .page-input {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #19263b;
      color: var(--ink);
      font: inherit;
    }
    button { padding: 0 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }
    .page-input { width: 55px; padding: 0 7px; text-align: center; }
    .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .progress { height: 2px; background: #202d43; }
    .progress span { display: block; width: 0; height: 100%; background: var(--accent); transition: width .15s ease; }
    main { width: 100%; padding: 28px 16px 64px; }
    .pages { display: grid; justify-items: center; gap: 26px; }
    .page {
      width: min(100%, 1600px);
      margin: 0;
      scroll-margin-top: 82px;
      border: 1px solid rgba(149, 170, 198, .28);
      background: #111a2c;
      box-shadow: 0 14px 48px rgba(0, 0, 0, .28);
    }
    .page img { display: block; width: 100%; height: auto; }
    .page figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 34px;
      padding: 7px 12px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
    }
    .page figcaption a { color: var(--accent); text-decoration: none; }
    .page figcaption a:hover { text-decoration: underline; }
    .noscript { margin: 0 auto 20px; color: var(--muted); text-align: center; }
    @media (max-width: 600px) {
      .toolbar { min-height: 58px; gap: 8px; padding-inline: 10px; }
      .brand h1 { font-size: 12px; }
      .brand p { font-size: 9px; }
      .controls { gap: 4px; }
      button { min-height: 32px; padding: 0 8px; font-size: 12px; }
      .page-input { width: 43px; min-height: 32px; }
      .count { font-size: 10px; }
      .optional { display: none; }
      main { padding: 12px 5px 32px; }
      .pages { gap: 12px; }
      .page { border-inline: 0; }
      .page figcaption { min-height: 28px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <h1>黎怡捷 · UI/UX 设计师作品集</h1>
      <p>PORTFOLIO · 01—43</p>
    </div>
    <nav class="controls" aria-label="作品集页码控制">
      <button id="previous" type="button" aria-label="上一页">上一页</button>
      <input id="pageNumber" class="page-input" type="number" min="1" max="43" value="1" aria-label="跳转到页码">
      <span class="count">/ 43</span>
      <button id="next" type="button" aria-label="下一页">下一页</button>
      <button id="fullscreen" class="optional" type="button">全屏</button>
    </nav>
  </header>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <main>
    <noscript><p class="noscript">请开启浏览器 JavaScript 以浏览作品集页面。</p></noscript>
    <section id="pages" class="pages" aria-label="作品集页面"></section>
  </main>
  <script>
    const pagesRoot = document.querySelector("#pages");
    const pageInput = document.querySelector("#pageNumber");
    const previous = document.querySelector("#previous");
    const next = document.querySelector("#next");
    const progressBar = document.querySelector("#progressBar");
    const figures = [];

    for (let page = 1; page <= 43; page += 1) {
      const number = String(page).padStart(2, "0");
      const figure = document.createElement("figure");
      figure.className = "page";
      figure.id = `page-${number}`;
      figure.dataset.page = String(page);

      const link = document.createElement("a");
      link.href = `images/${number}.jpg`;
      link.target = "_blank";
      link.rel = "noopener";
      link.setAttribute("aria-label", `在新标签页打开第 ${number} 页原图`);

      const image = document.createElement("img");
      image.src = link.href;
      image.alt = `黎怡捷 UI/UX 设计师作品集，第 ${number} 页`;
      image.width = 1920;
      image.loading = page <= 2 ? "eager" : "lazy";
      image.decoding = "async";
      link.append(image);

      const caption = document.createElement("figcaption");
      const label = document.createElement("span");
      label.textContent = `${number} / 43`;
      const original = document.createElement("a");
      original.href = link.href;
      original.target = "_blank";
      original.rel = "noopener";
      original.textContent = "打开原图 ↗";
      caption.append(label, original);
      figure.append(link, caption);
      pagesRoot.append(figure);
      figures.push(figure);
    }

    function goTo(page) {
      const safePage = Math.min(43, Math.max(1, Number(page) || 1));
      figures[safePage - 1].scrollIntoView({ behavior: "smooth", block: "start" });
      pageInput.value = String(safePage);
    }

    previous.addEventListener("click", () => goTo(Number(pageInput.value) - 1));
    next.addEventListener("click", () => goTo(Number(pageInput.value) + 1));
    pageInput.addEventListener("change", () => goTo(pageInput.value));
    pageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { goTo(pageInput.value); pageInput.blur(); }
    });
    document.querySelector("#fullscreen").addEventListener("click", async () => {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
      else await document.exitFullscreen?.();
    });

    const observer = new IntersectionObserver((entries) => {
      const visible = entries
        .filter((entry) => entry.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!visible) return;
      const current = Number(visible.target.dataset.page);
      pageInput.value = String(current);
      previous.disabled = current === 1;
      next.disabled = current === 43;
      progressBar.style.width = `${(current / 43) * 100}%`;
    }, { threshold: [0.2, 0.5, 0.8] });
    figures.forEach((figure) => observer.observe(figure));
    previous.disabled = true;
  </script>
</body>
</html>
